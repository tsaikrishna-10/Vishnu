name: VISHNU Android APK

on:
  push:
    branches:
      - main
      - feature/android-native-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already include the Android SDK.
      # Avoid setup-android's obsolete "sdkmanager tools" installation.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --sdk_root="${ANDROID_HOME}" --licenses

      - name: Install Android SDK platform and build tools
        run: sdkmanager --sdk_root="${ANDROID_HOME}" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload VISHNU APK
        uses: actions/upload-artifact@v4
        with:
          name: VISHNU-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
